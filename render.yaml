# Render Blueprint — motor de contratos e de PDF da Sportrail.
# Deploy: em render.com → New → Blueprint → liga este repo (sportrail-contratos).
# O Render lê o Dockerfile.
services:
  - type: web
    name: sportrail-contratos
    runtime: docker
    plan: free
    region: frankfurt          # Europa (mais perto de PT)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # O Render injeta a env var PORT automaticamente; o Dockerfile usa ${PORT}.
    envVars:
      # Único segredo que esta app precisa. Sem ele os três /api/* respondem
      # 503 — de propósito, para a falta de configuração não passar
      # despercebida. Tem de ser igual ao CONTRATOS_PDF_TOKEN do dashboard.
      - key: PDF_API_TOKEN
        sync: false
      # Saíram daqui SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_USER,
      # ADMIN_PASS e BASE_URL: esta app deixou de ter estado, utilizadores e
      # links próprios. Convém apagá-las também no dashboard do Render — uma
      # service role key esquecida num serviço que já não a usa é só risco.
